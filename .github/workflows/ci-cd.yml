name: CI dan Publikasi GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3
          coverage: none
      - name: Install Composer
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Siapkan environment testing
        working-directory: backend
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
      - name: Feature test Laravel
        working-directory: backend
        run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm
        working-directory: frontend
        run: npm ci
      - name: Build Vue
        working-directory: frontend
        run: npm run build

  deploy:
    name: deploy (publish images to GHCR)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Buildx
        uses: docker/setup-buildx-action@v3
      - name: Nama image huruf kecil
        id: names
        shell: bash
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"
      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:sha-${{ github.sha }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:latest
            ${{ steps.names.outputs.frontend }}:sha-${{ github.sha }}
